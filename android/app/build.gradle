plugins {
    id "com.android.application"
}

android {
    namespace "com.gaong.lifeos"
    compileSdk 35

    defaultConfig {
        applicationId "com.gaong.lifeos"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


def webSourceRoot = rootProject.projectDir.parentFile
def webAssetsDir = file("src/main/assets/www")

tasks.register("syncLifeOsWeb", Copy) {
    from(webSourceRoot) {
        include "index.html"
        include "app.js"
        include "styles.css"
        include "components.css"
        include "extras.css"
        include "mobile.css"
        include "manifest.webmanifest"
        include "sw.js"
    }
    into(webAssetsDir)
}

tasks.named("preBuild").configure {
    dependsOn("syncLifeOsWeb")
}
