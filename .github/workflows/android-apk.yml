name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "components.css"
      - "extras.css"
      - "mobile.css"
      - "manifest.webmanifest"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk artifact/LifeOS-v1.0.0.apk
          sha256sum artifact/LifeOS-v1.0.0.apk > artifact/LifeOS-v1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-APK
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
